events {
    worker_connections 1024;
}

http {
    # Базовые настройки
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Лимит размера загружаемых файлов
    client_max_body_size 10M;

    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ОБЯЗАТЕЛЬНО до первого `map`: как только nginx разобрал хоть один map,
    # размер бакета зафиксирован, и объявление ниже по файлу падает с
    # «directive is duplicate». Дефолт в 64 байта не вмещает значение
    # $money_setcookie (Set-Cookie с 64-символьным секретом — ~130 байт), без
    # чего nginx не стартует с «could not build map_hash».
    map_hash_bucket_size 256;

    # Docker DNS — резолвит имя контейнера динамически при каждом запросе
    # Без этого nginx кэширует IP при старте и падает с 502 после пересоздания api-контейнера
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Connection для проксирования: "upgrade" только когда клиент реально
    # запрашивает апгрейд. Раньше заголовок ставился безусловно на КАЖДЫЙ
    # запрос в `location /`, что ломает keep-alive до апстрима и сбивает с
    # толку прокси на пути. См. SECURITY_AUDIT_PRERELEASE.md §S16.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── Rate limiting на эдже (§S13) ────────────────────────────────────────
    # В приложении лимиты держит slowapi в памяти процесса: они обнуляются на
    # каждом деплое и на время blue-green-перекрытия удваиваются. Здесь —
    # грубый потолок, который переживает рестарт api и стоит почти ничего.
    # Ключ — $binary_remote_addr (реальный TCP-peer, подделать нельзя).
    #
    # 30 r/s общий: страница профиля тянет десятки обложек параллельно, ниже
    # ставить нельзя. 2 r/s на запись: регистрация, вход, сброс пароля,
    # создание записей — живому человеку столько не нужно.
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api_write:10m rate=2r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=api_conn:10m;

    # ── Логи без query-строки для WS (§S9) ──────────────────────────────────
    # Браузерный WebSocket не умеет кастомные заголовки, поэтому access-токен
    # едет в query (?token=...). Дефолтный формат combined пишет $request
    # целиком — то есть валидные токены оседали бы в access.log открытым
    # текстом, попадая в ротацию, бэкапы и любой сборщик логов.
    # $uri — путь без аргументов.
    log_format ws_safe '$remote_addr - $remote_user [$time_local] '
                       '"$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

    # Proxy cache — публичные данные Discogs (поиск, мастера, артисты)
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m max_size=1g inactive=60m use_temp_path=off;

    # Кэш ресайз-деривативов обложек (imgproxy). Отдельный путь/зона/том —
    # чтобы не пересекаться с api_cache. Капнут сверху, самоочищается.
    proxy_cache_path /var/cache/nginx_covers levels=1:2 keys_zone=covers_cache:10m max_size=2g inactive=30d use_temp_path=off;

    # Формат дериватива по Accept. WebP на том же качестве весит на 25-35%
    # меньше JPEG; у Discogs формат-негоциация выключена (на Accept: image/webp
    # их CDN отдаёт JPEG), так что это чистый выигрыш поверх их схемы.
    # Значение ВХОДИТ в proxy_cache_key — иначе клиент без WebP получил бы
    # закэшированный WebP соседа (и наоборот).
    map $http_accept $cover_fmt {
        default        "jpg";
        "~*image/webp" "webp";
    }

    # Cache-Control обложек зависит от наличия метки версии `?v=` (её ставят
    # схемы из cover_cached_at). Причина: зеркало ПЕРЕЗАПИСЫВАЕТ мелкий мастер
    # лучшим источником, то есть содержимое по стабильному пути меняется.
    #   с ?v= — URL меняется вместе с картинкой ⇒ immutable на год безопасен;
    #   без ?v= — старые сборки из стора, которым нельзя запинить обложку
    #             навсегда: короткий TTL, чтобы апгрейд до них доехал.
    map $arg_v $cover_cc {
        default "public, max-age=31536000, immutable";
        ""      "public, max-age=604800";
    }

    # HTTP -> HTTPS редирект (основной домен)
    server {
        listen 80;
        server_name vinyl-vertushka.ru www.vinyl-vertushka.ru;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://vinyl-vertushka.ru$request_uri;
        }
    }

    # HTTP -> HTTPS редирект (API)
    server {
        listen 80;
        server_name api.vinyl-vertushka.ru;

        # Для проверки домена Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Всё остальное редиректим на HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTP -> HTTPS редирект (GlitchTip / Sentry)
    server {
        listen 80;
        server_name sentry.vinyl-vertushka.ru;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Куки-авторизация финансового дашборда ($money_ok, $money_setcookie).
    # Файл лежит на сервере (/home/deploy/dashboard/auth.conf) и НЕ версионируется —
    # в нём секрет. Без него nginx не стартует, поэтому создавать до рестарта.
    include /etc/nginx/money_auth.conf;

    # HTTP -> HTTPS редирект (личный финансовый дашборд)
    server {
        listen 80;
        server_name money.vinyl-vertushka.ru;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS — личный финансовый дашборд Влада (проект hermes-finance-bot).
    #
    # К Вертушке отношения не имеет: это статический index.html, который генерит
    # бот и заливает rsync-ом в /home/deploy/dashboard/public. nginx только
    # раздаёт файл — ни апстрима, ни базы, ни памяти. Живёт здесь, потому что
    # 80/443 на этом сервере уже держит этот nginx, а поднимать второй веб-сервер
    # ради 16 КБ статики бессмысленно.
    #
    # ⚠️ СНАЧАЛА СЕРТИФИКАТ, ПОТОМ РЕСТАРТ. nginx не стартует, если не может
    # прочитать ЛЮБОЙ ssl_certificate, — а падает он целиком, вместе с api и
    # основным доменом. Пока certbot не выпустил money.vinyl-vertushka.ru,
    # этот блок обязан оставаться закомментированным.
    server {
        listen 443 ssl http2;
        server_name money.vinyl-vertushka.ru;

        ssl_certificate /etc/letsencrypt/live/money.vinyl-vertushka.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/money.vinyl-vertushka.ru/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

        root /srv/money;
        index index.html;

        # Единственное место, где спрашивают пароль. Зашёл — получил куку на
        # 30 дней и дальше не вводишь. Сам Basic Auth так не умеет: в нём нет ни
        # сессии, ни срока — браузер забывает креды когда сочтёт нужным.
        # Файл с хешем лежит ВНЕ раздаваемого каталога, иначе его бы скачали.
        # ⚠️ try_files, а НЕ `return`. `return` отрабатывает в фазе rewrite,
        # которая идёт ДО фазы access с auth_basic — то есть редирект случался
        # бы раньше проверки пароля, и куку получал бы кто угодно. Проверено:
        # так и было, /enter отдавал 302 с Set-Cookie анонимному запросу.
        # try_files доводит запрос до фазы content, после проверки пароля.
        location = /enter {
            auth_basic "Расклад";
            auth_basic_user_file /etc/nginx/money.htpasswd;
            try_files /__grant__ @money_grant;
        }

        # Внутренняя, снаружи не запрашивается. Здесь же и add_header —
        # заголовки из /enter на ответ named-локации не наследуются.
        location @money_grant {
            add_header Set-Cookie $money_setcookie always;
            return 302 https://$host/;
        }

        location / {
            # Кука — ключ на предъявителя, поэтому HttpOnly (не видна из JS),
            # Secure (не уходит по HTTP) и SameSite=Lax (не улетает с чужих
            # сайтов). Отзыв — только ротацией секрета в auth.conf, и тогда
            # разлогинятся все устройства сразу.
            if ($money_ok = 0) {
                return 302 https://$host/enter;
            }

            try_files $uri $uri/ =404;

            # Файл перезаписывается кроном раз в час — кэш здесь означал бы
            # вчерашние цифры, то есть ровно ту проблему, ради которой всё затевалось.
            add_header Cache-Control "no-store" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
        }
    }

    # HTTPS — основной домен (публичные профили, /privacy, /terms)
    server {
        listen 443 ssl http2;
        server_name vinyl-vertushka.ru;

        ssl_certificate /etc/letsencrypt/live/vinyl-vertushka.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/vinyl-vertushka.ru/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

        # ВНИМАНИЕ: add_header в location ОТМЕНЯЕТ все унаследованные из server.
        # Поэтому набор ниже продублирован в каждом location, где есть свой
        # add_header. Вынести в отдельный файл и include'ить было бы чище, но
        # это требует нового монтирования в docker-compose, а деплой nginx тут
        # и без того хрупкий — предпочитаем многословие лишним движущимся частям.
        # См. SECURITY_AUDIT_PRERELEASE.md §S11.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # X-XSS-Protection намеренно НЕ отдаём: заголовок устарел, в ряде
        # браузеров сам был вектором, современная замена — CSP ниже (§S15).
        #
        # CSP. 'unsafe-inline' в script-src приходится оставить: в шаблонах 14
        # инлайновых обработчиков (onclick="openRecordPreview(this)") и
        # инлайновые <script>. Убрать их — отдельная задача, а выкатывать
        # строгий script-src сейчас значило бы просто сломать публичный профиль.
        #
        # Ценность директива несёт и в таком виде. Из трёх коротких полезных
        # нагрузок, которыми эксплуатировался XSS в fun-stats (§S1), CSP гасит
        # две: base-uri убивает <base href=//x.ru>, а script-src без wildcard —
        # <script src=//evil.ru>. Плюс form-action не даёт внедрённой форме
        # утечь на чужой хост, а frame-ancestors закрывает кликджекинг.
        # mc.yandex.ru — на случай включения счётчика (YANDEX_METRIKA_COUNTER_ID).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://mc.yandex.ru; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://mc.yandex.ru; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

        # blue-green: $api_upstream задаётся здесь, deploy.sh переключает цвет
        include /etc/nginx/active_upstream.conf;

        location /covers/ {
            root /app/uploads;
            # Тот же режим, что в api-блоке: год с immutable для URL с `?v=`,
            # неделя без метки. Обложка перезаписывается при апгрейде мастера,
            # поэтому «навсегда» можно только версионированному URL.
            add_header Cache-Control $cover_cc always;
            # Продублировано: свой add_header выше отменил унаследованные.
            add_header X-Content-Type-Options "nosniff" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            try_files $uri @covers_fallback_web;
        }

        location @covers_fallback_web {
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }

    # HTTPS сервер (API)
    server {
        listen 443 ssl http2;
        server_name api.vinyl-vertushka.ru;

        # SSL сертификаты
        ssl_certificate /etc/letsencrypt/live/api.vinyl-vertushka.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.vinyl-vertushka.ru/privkey.pem;

        # SSL настройки безопасности
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

        # Заголовки безопасности. Про дублирование в location — см. комментарий
        # в блоке основного домена выше (add_header не наследуется при
        # переопределении). X-XSS-Protection убран как устаревший (§S15).
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Ограничение одновременных соединений с одного адреса. API отдаёт
        # JSON и картинки; 40 параллельных коннектов — с большим запасом для
        # мобильного клиента и мало для качалки.
        limit_conn api_conn 40;

        # blue-green: $api_upstream задаётся здесь, deploy.sh переключает цвет
        include /etc/nginx/active_upstream.conf;

        # --- Кэшируемые публичные эндпоинты Discogs ---

        # Поиск: 5 минут
        location ~ ^/api/records/(search|masters/search|releases/search|artists/search) {
            proxy_cache api_cache;
            proxy_cache_key "$request_method$scheme$host$uri$is_args$args";
            proxy_cache_valid 200 5m;
            proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
            add_header X-Cache-Status $upstream_cache_status always;
            # Свой add_header отменяет унаследованные из server — дублируем.
            add_header X-Content-Type-Options "nosniff" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Мастер-релизы (детали + версии): 1 час
        location ~ ^/api/records/masters/ {
            proxy_cache api_cache;
            proxy_cache_key "$request_method$scheme$host$uri$is_args$args";
            proxy_cache_valid 200 1h;
            proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
            add_header X-Cache-Status $upstream_cache_status always;
            # Свой add_header отменяет унаследованные из server — дублируем.
            add_header X-Content-Type-Options "nosniff" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Артисты (профиль + релизы): 30 минут
        location ~ ^/api/records/artists/ {
            proxy_cache api_cache;
            proxy_cache_key "$request_method$scheme$host$uri$is_args$args";
            proxy_cache_valid 200 30m;
            proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
            add_header X-Cache-Status $upstream_cache_status always;
            # Свой add_header отменяет унаследованные из server — дублируем.
            add_header X-Content-Type-Options "nosniff" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Релизы по Discogs ID: 1 час
        location ~ ^/api/records/discogs/ {
            proxy_cache api_cache;
            proxy_cache_key "$request_method$scheme$host$uri$is_args$args";
            proxy_cache_valid 200 1h;
            proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
            add_header X-Cache-Status $upstream_cache_status always;
            # Свой add_header отменяет унаследованные из server — дублируем.
            add_header X-Content-Type-Options "nosniff" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # --- Обложки под размер ячейки/экрана (imgproxy) ---
        # Новый путь /covers/w/{width}/{id}.jpg — режет мастер под нужный размер
        # на лету. Старый /covers/{id}.jpg (ниже) не тронут: старые сборки и
        # запросы без размера работают как прежде. imgproxy внутренний, резолвим
        # в рантайме через переменную (как $api_upstream), чтобы nginx стартовал
        # даже если контейнер на секунду недоступен. enlarge=0 → без апскейла
        # выше мастера ⇒ пикселизации нет. Кэш деривативов — covers_cache.
        # Ширина 10..9999 (регекс), имя файла без '/' (анти-traversal).
        location ~ "^/covers/w/(?<cw>[1-9][0-9]{1,3})/(?<cfile>[A-Za-z0-9._-]+\.jpg)$" {
            # set ДО rewrite: `rewrite ... break` останавливает rewrite-фазу,
            # поэтому set после него не выполнился бы ($imgproxy_host пустой →
            # «no host in upstream»). Переменная-хост (не весь URL) → runtime-
            # резолвинг через resolver, схема/порт литералом, чтобы переписанный
            # URI подставился (весь URL в переменной давал «invalid URL prefix»).
            set $imgproxy_host imgproxy;
            rewrite ^ /insecure/rs:fit:$cw:0:0/plain/local:///covers/$cfile@$cover_fmt break;
            proxy_pass http://$imgproxy_host:8080;
            proxy_cache covers_cache;
            # Ключ включает формат и метку версии. Без $cover_fmt клиент без
            # WebP получил бы WebP соседа; без $arg_v перезаписанный мастер
            # продолжал бы отдаваться старой нарезкой до 30 дней.
            proxy_cache_key "$cw/$cfile/$cover_fmt/$arg_v";
            proxy_cache_valid 200 30d;
            proxy_cache_use_stale error timeout updating;
            # imgproxy присылает свой Cache-Control (IMGPROXY_TTL=2592000), и он
            # складывался с нашим в одну строку из трёх значений:
            # «max-age=2592000, public, public, max-age=604800». Прячем оба
            # апстримных заголовка — политику кэша определяем мы ($cover_cc),
            # причём она зависит от наличия `?v=`, а imgproxy об этом не знает.
            # На решение самого nginx кэшировать это НЕ влияет: proxy_hide_header
            # режет только ответ клиенту, а тут ещё и явный proxy_cache_valid.
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            add_header X-Cache-Status $upstream_cache_status always;
            # Vary: Accept — чтобы промежуточные кэши (CDN, корпоративные прокси)
            # тоже не смешивали WebP и JPEG для одного URL.
            add_header Vary Accept always;
            add_header Cache-Control $cover_cc always;
            # Продублировано: свой add_header выше отменил унаследованные.
            add_header X-Content-Type-Options "nosniff" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        }

        # --- Обложки виниловых пластинок (оригинал/мастер) ---
        # Отдаём статику напрямую; если файла нет — fallback на FastAPI
        # Используем root + prefix /covers/ (НЕ alias — у alias баг с try_files)
        location /covers/ {
            root /app/uploads;
            # Один заголовок, а не `expires` + `add_header` (те давали два
            # конфликтующих Cache-Control). Год с immutable — только для URL с
            # `?v=`; без метки остаётся неделя, см. map $arg_v выше.
            add_header Cache-Control $cover_cc always;
            # Продублировано: свой add_header выше отменил унаследованные.
            add_header X-Content-Type-Options "nosniff" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            try_files $uri @covers_fallback;
        }

        location @covers_fallback {
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # WebSocket сообщений. Отдельный location ради формата лога: токен в
        # query не должен попадать на диск (§S9).
        #
        # ЧАСТИЧНО. Формат настраивается только у access_log; error_log пишет
        # $request целиком, и настроить это в nginx нельзя. То есть при ошибке
        # (429, апстрим недоступен, разрыв) токен всё равно окажется в
        # error.log. Полностью проблему снимает только одноразовый ticket
        # вместо access-токена в query — вынесено в бэклог, см. §S9.
        location = /api/messages/ws {
            access_log /var/log/nginx/ws_access.log ws_safe;

            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # Долгоживущее соединение: держим открытым, а не рвём по 60с.
            proxy_connect_timeout 60s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
        }

        # Точечный жёсткий лимит на изменяющие/дорогие ручки аутентификации.
        # В приложении на них уже висит @limiter (3-5/мин), но тот живёт в
        # памяти процесса и обнуляется на каждом деплое. Здесь потолок,
        # который деплой переживает. burst=5 — чтобы не рубить человека,
        # промахнувшегося паролем пару раз подряд.
        location ~ ^/api/auth/(register|login|forgot-password|verify-reset-code|reset-password) {
            limit_req zone=api_write burst=5 nodelay;

            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Проксирование на FastAPI (всё остальное — без кэша)
        location / {
            # burst=60 при rate=30r/s: экран профиля тянет обложки пачкой,
            # и без запаса живой пользователь ловил бы 429 на ровном месте.
            limit_req zone=api_general burst=60 nodelay;

            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # $connection_upgrade вместо литерального "upgrade": см. map вверху.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # ВАЖНО: передаём Authorization header
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;

            # Таймауты
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }

    # HTTPS — GlitchTip (Sentry-совместимый сбор крэшей)
    server {
        listen 443 ssl http2;
        server_name sentry.vinyl-vertushka.ru;

        ssl_certificate /etc/letsencrypt/live/sentry.vinyl-vertushka.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sentry.vinyl-vertushka.ru/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

        # Крэш-дампы и source maps бывают крупные
        client_max_body_size 30M;

        # glitchtip-web-1 резолвится через docker DNS (nginx подключён к сети glitchtip)
        set $glitchtip http://glitchtip-web-1:8080;

        location / {
            proxy_pass $glitchtip;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 120s;
        }
    }

}
