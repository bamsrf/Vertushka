events {
    worker_connections 1024;
}

http {
    # Базовые настройки
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Лимит размера загружаемых файлов
    client_max_body_size 10M;

    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Docker DNS — резолвит имя контейнера динамически при каждом запросе
    # Без этого nginx кэширует IP при старте и падает с 502 после пересоздания api-контейнера
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Proxy cache — публичные данные Discogs (поиск, мастера, артисты)
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m max_size=1g inactive=60m use_temp_path=off;

    # Кэш ресайз-деривативов обложек (imgproxy). Отдельный путь/зона/том —
    # чтобы не пересекаться с api_cache. Капнут сверху, самоочищается.
    proxy_cache_path /var/cache/nginx_covers levels=1:2 keys_zone=covers_cache:10m max_size=2g inactive=30d use_temp_path=off;

    # Формат дериватива по Accept. WebP на том же качестве весит на 25-35%
    # меньше JPEG; у Discogs формат-негоциация выключена (на Accept: image/webp
    # их CDN отдаёт JPEG), так что это чистый выигрыш поверх их схемы.
    # Значение ВХОДИТ в proxy_cache_key — иначе клиент без WebP получил бы
    # закэшированный WebP соседа (и наоборот).
    map $http_accept $cover_fmt {
        default        "jpg";
        "~*image/webp" "webp";
    }

    # Cache-Control обложек зависит от наличия метки версии `?v=` (её ставят
    # схемы из cover_cached_at). Причина: зеркало ПЕРЕЗАПИСЫВАЕТ мелкий мастер
    # лучшим источником, то есть содержимое по стабильному пути меняется.
    #   с ?v= — URL меняется вместе с картинкой ⇒ immutable на год безопасен;
    #   без ?v= — старые сборки из стора, которым нельзя запинить обложку
    #             навсегда: короткий TTL, чтобы апгрейд до них доехал.
    map $arg_v $cover_cc {
        default "public, max-age=31536000, immutable";
        ""      "public, max-age=604800";
    }

    # HTTP -> HTTPS редирект (основной домен)
    server {
        listen 80;
        server_name vinyl-vertushka.ru www.vinyl-vertushka.ru;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://vinyl-vertushka.ru$request_uri;
        }
    }

    # HTTP -> HTTPS редирект (API)
    server {
        listen 80;
        server_name api.vinyl-vertushka.ru;

        # Для проверки домена Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Всё остальное редиректим на HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTP -> HTTPS редирект (GlitchTip / Sentry)
    server {
        listen 80;
        server_name sentry.vinyl-vertushka.ru;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS — основной домен (публичные профили, /privacy, /terms)
    server {
        listen 443 ssl http2;
        server_name vinyl-vertushka.ru;

        ssl_certificate /etc/letsencrypt/live/vinyl-vertushka.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/vinyl-vertushka.ru/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # blue-green: $api_upstream задаётся здесь, deploy.sh переключает цвет
        include /etc/nginx/active_upstream.conf;

        location /covers/ {
            root /app/uploads;
            # Тот же режим, что в api-блоке: год с immutable для URL с `?v=`,
            # неделя без метки. Обложка перезаписывается при апгрейде мастера,
            # поэтому «навсегда» можно только версионированному URL.
            add_header Cache-Control $cover_cc always;
            try_files $uri @covers_fallback_web;
        }

        location @covers_fallback_web {
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }

    # HTTPS сервер (API)
    server {
        listen 443 ssl http2;
        server_name api.vinyl-vertushka.ru;

        # SSL сертификаты
        ssl_certificate /etc/letsencrypt/live/api.vinyl-vertushka.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.vinyl-vertushka.ru/privkey.pem;

        # SSL настройки безопасности
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

        # Заголовки безопасности
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # blue-green: $api_upstream задаётся здесь, deploy.sh переключает цвет
        include /etc/nginx/active_upstream.conf;

        # --- Кэшируемые публичные эндпоинты Discogs ---

        # Поиск: 5 минут
        location ~ ^/api/records/(search|masters/search|releases/search|artists/search) {
            proxy_cache api_cache;
            proxy_cache_key "$request_method$scheme$host$uri$is_args$args";
            proxy_cache_valid 200 5m;
            proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
            add_header X-Cache-Status $upstream_cache_status always;

            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Мастер-релизы (детали + версии): 1 час
        location ~ ^/api/records/masters/ {
            proxy_cache api_cache;
            proxy_cache_key "$request_method$scheme$host$uri$is_args$args";
            proxy_cache_valid 200 1h;
            proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
            add_header X-Cache-Status $upstream_cache_status always;

            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Артисты (профиль + релизы): 30 минут
        location ~ ^/api/records/artists/ {
            proxy_cache api_cache;
            proxy_cache_key "$request_method$scheme$host$uri$is_args$args";
            proxy_cache_valid 200 30m;
            proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
            add_header X-Cache-Status $upstream_cache_status always;

            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Релизы по Discogs ID: 1 час
        location ~ ^/api/records/discogs/ {
            proxy_cache api_cache;
            proxy_cache_key "$request_method$scheme$host$uri$is_args$args";
            proxy_cache_valid 200 1h;
            proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
            add_header X-Cache-Status $upstream_cache_status always;

            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # --- Обложки под размер ячейки/экрана (imgproxy) ---
        # Новый путь /covers/w/{width}/{id}.jpg — режет мастер под нужный размер
        # на лету. Старый /covers/{id}.jpg (ниже) не тронут: старые сборки и
        # запросы без размера работают как прежде. imgproxy внутренний, резолвим
        # в рантайме через переменную (как $api_upstream), чтобы nginx стартовал
        # даже если контейнер на секунду недоступен. enlarge=0 → без апскейла
        # выше мастера ⇒ пикселизации нет. Кэш деривативов — covers_cache.
        # Ширина 10..9999 (регекс), имя файла без '/' (анти-traversal).
        location ~ "^/covers/w/(?<cw>[1-9][0-9]{1,3})/(?<cfile>[A-Za-z0-9._-]+\.jpg)$" {
            # set ДО rewrite: `rewrite ... break` останавливает rewrite-фазу,
            # поэтому set после него не выполнился бы ($imgproxy_host пустой →
            # «no host in upstream»). Переменная-хост (не весь URL) → runtime-
            # резолвинг через resolver, схема/порт литералом, чтобы переписанный
            # URI подставился (весь URL в переменной давал «invalid URL prefix»).
            set $imgproxy_host imgproxy;
            rewrite ^ /insecure/rs:fit:$cw:0:0/plain/local:///covers/$cfile@$cover_fmt break;
            proxy_pass http://$imgproxy_host:8080;
            proxy_cache covers_cache;
            # Ключ включает формат и метку версии. Без $cover_fmt клиент без
            # WebP получил бы WebP соседа; без $arg_v перезаписанный мастер
            # продолжал бы отдаваться старой нарезкой до 30 дней.
            proxy_cache_key "$cw/$cfile/$cover_fmt/$arg_v";
            proxy_cache_valid 200 30d;
            proxy_cache_use_stale error timeout updating;
            # imgproxy присылает свой Cache-Control (IMGPROXY_TTL=2592000), и он
            # складывался с нашим в одну строку из трёх значений:
            # «max-age=2592000, public, public, max-age=604800». Прячем оба
            # апстримных заголовка — политику кэша определяем мы ($cover_cc),
            # причём она зависит от наличия `?v=`, а imgproxy об этом не знает.
            # На решение самого nginx кэшировать это НЕ влияет: proxy_hide_header
            # режет только ответ клиенту, а тут ещё и явный proxy_cache_valid.
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            add_header X-Cache-Status $upstream_cache_status always;
            # Vary: Accept — чтобы промежуточные кэши (CDN, корпоративные прокси)
            # тоже не смешивали WebP и JPEG для одного URL.
            add_header Vary Accept always;
            add_header Cache-Control $cover_cc always;
        }

        # --- Обложки виниловых пластинок (оригинал/мастер) ---
        # Отдаём статику напрямую; если файла нет — fallback на FastAPI
        # Используем root + prefix /covers/ (НЕ alias — у alias баг с try_files)
        location /covers/ {
            root /app/uploads;
            # Один заголовок, а не `expires` + `add_header` (те давали два
            # конфликтующих Cache-Control). Год с immutable — только для URL с
            # `?v=`; без метки остаётся неделя, см. map $arg_v выше.
            add_header Cache-Control $cover_cc always;
            try_files $uri @covers_fallback;
        }

        location @covers_fallback {
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Проксирование на FastAPI (всё остальное — без кэша)
        location / {
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # ВАЖНО: передаём Authorization header
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;

            # Таймауты
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }

    # HTTPS — GlitchTip (Sentry-совместимый сбор крэшей)
    server {
        listen 443 ssl http2;
        server_name sentry.vinyl-vertushka.ru;

        ssl_certificate /etc/letsencrypt/live/sentry.vinyl-vertushka.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sentry.vinyl-vertushka.ru/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

        # Крэш-дампы и source maps бывают крупные
        client_max_body_size 30M;

        # glitchtip-web-1 резолвится через docker DNS (nginx подключён к сети glitchtip)
        set $glitchtip http://glitchtip-web-1:8080;

        location / {
            proxy_pass $glitchtip;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 120s;
        }
    }

}
