# Активный blue-green апстрим. Переписывается scripts/deploy.sh при переключении
# цвета и подхватывается `nginx -s reload`. Инклюдится внутри каждого server-блока
# (основной домен + api-домен) вместо хардкода адреса.
#
# Значение — имя контейнера активного цвета (vertushka_api_blue|green), резолвится
# Docker DNS в рантайме. Не редактировать руками во время нормальной работы:
# источник правды о текущем цвете — nginx/.active_color, deploy.sh держит их в
# синхроне.
set $api_upstream http://vertushka_api_blue:8000;
