# Тесты бэкенда на каждый push и PR в main.
#
# Раньше в CI гонялся только sync-roadmap, поэтому сломанный тест доезжал до
# прода незамеченным. Интеграционные тесты требуют живой Postgres — он поднят
# сервисом ниже; без него они молча пропускаются, что в CI недопустимо, отсюда
# явный DATABASE_URL на весь шаг.
name: backend-tests

on:
  push:
    branches: [main]
    paths:
      - "Вертушка/Backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "Вертушка/Backend/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Вертушка/Backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vertushka_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vertushka_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Базу интеграционных тестов задаёт TEST_DATABASE_URL — DATABASE_URL
      # conftest выставляет из неё сам (см. tests/integration/conftest.py).
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:55432/vertushka_test
      # Отвалившийся Postgres не должен выглядеть как зелёный прогон:
      # с этим флагом интеграционные тесты падают вместо skip (см. conftest).
      REQUIRE_TEST_DB: "1"
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-secret
      DISCOGS_TOKEN: ci-token

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Вертушка/Backend/requirements.txt

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Прогнать тесты
        run: pytest tests
